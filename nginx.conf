worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Proxy API calls to the backend over the internal Docker network, so the
        # browser only ever needs the UI origin. Removes CORS and the need to reach
        # the API on a separate published port.
        location /api/ {
            proxy_pass http://cwapi:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html =404;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
